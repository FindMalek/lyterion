# Vercel-style previews on the-keep (D-036): images per PR, Dokploy apps + Postgres, sticky comment.
# Skipped until vars.DOKPLOY_URL is set, see docs/infra.md#previews.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
  DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
  DOKPLOY_PUBLIC_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  deploy:
    if: github.event.action != 'closed' && vars.DOKPLOY_URL != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: the-keep
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/findmalek/lyterion-api:pr-${{ env.PR_NUMBER }}
          build-args: |
            NEXT_PUBLIC_LYTERION_API_URL=https://pr-${{ env.PR_NUMBER }}-api.${{ vars.PREVIEW_DOMAIN }}
            NEXT_PUBLIC_LYTERION_DASHBOARD_URL=https://pr-${{ env.PR_NUMBER }}.${{ vars.PREVIEW_DOMAIN }}
            NEXT_PUBLIC_LYTERION_ALLOWED_ORIGIN=https://pr-${{ env.PR_NUMBER }}.${{ vars.PREVIEW_DOMAIN }}
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}

      - name: Build dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: ghcr.io/findmalek/lyterion-dashboard:pr-${{ env.PR_NUMBER }}
          build-args: |
            NEXT_PUBLIC_LYTERION_API_URL=https://pr-${{ env.PR_NUMBER }}-api.${{ vars.PREVIEW_DOMAIN }}
            NEXT_PUBLIC_LYTERION_DASHBOARD_URL=https://pr-${{ env.PR_NUMBER }}.${{ vars.PREVIEW_DOMAIN }}
            NEXT_PUBLIC_LYTERION_ALLOWED_ORIGIN=https://pr-${{ env.PR_NUMBER }}.${{ vars.PREVIEW_DOMAIN }}
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}

      - name: Deploy preview
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          PREVIEW_APP_ENV: ${{ secrets.PREVIEW_APP_ENV }}
        run: node scripts/deploy/dokploy.mjs preview-up

      - name: Mark failed
        if: failure()
        run: node scripts/deploy/dokploy.mjs comment-failed

  cleanup:
    if: github.event.action == 'closed' && vars.DOKPLOY_URL != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: the-keep
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Delete preview
        run: node scripts/deploy/dokploy.mjs preview-down
