# Vercel-style previews on Dokploy (D-036, D-037), built on GitHub runners: images per PR, Dokploy apps + Postgres, sticky comment.
# Skipped until vars.DEPLOY_ENABLED is "true", see docs/infra.md#previews.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
  DOKPLOY_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
  DOKPLOY_PUBLIC_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # Both images build in parallel, each with its own GHA cache scope (shared with main, so PRs start warm).
  build:
    if: github.event.action != 'closed' && vars.DOKPLOY_PUBLIC_URL != '' && vars.DEPLOY_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, dashboard]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/findmalek/lyterion-${{ matrix.app }}:pr-${{ env.PR_NUMBER }}
          build-args: |
            NEXT_PUBLIC_LYTERION_API_URL=https://pr-${{ env.PR_NUMBER }}-api.${{ vars.PREVIEW_DOMAIN }}
            NEXT_PUBLIC_LYTERION_DASHBOARD_URL=https://pr-${{ env.PR_NUMBER }}.${{ vars.PREVIEW_DOMAIN }}
            NEXT_PUBLIC_LYTERION_ALLOWED_ORIGIN=https://pr-${{ env.PR_NUMBER }}.${{ vars.PREVIEW_DOMAIN }}
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max,ignore-error=true

      - name: Mark failed
        if: failure()
        run: node scripts/deploy/dokploy.mjs comment-failed

  deploy:
    needs: build
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy preview
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
          PREVIEW_APP_ENV: |
            LYTERION_BETTER_AUTH_SECRET=${{ secrets.LYTERION_BETTER_AUTH_SECRET }}
            LYTERION_SPOTIFY_CLIENT_ID=${{ secrets.LYTERION_SPOTIFY_CLIENT_ID }}
            LYTERION_SPOTIFY_CLIENT_SECRET=${{ secrets.LYTERION_SPOTIFY_CLIENT_SECRET }}
            LYTERION_AUTH_PRODUCTION_URL=https://${{ vars.PRODUCTION_API_HOST }}
        run: node scripts/deploy/dokploy.mjs preview-up

      - name: Mark failed
        if: failure()
        run: node scripts/deploy/dokploy.mjs comment-failed

  cleanup:
    if: github.event.action == 'closed' && vars.DOKPLOY_PUBLIC_URL != '' && vars.DEPLOY_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Delete preview
        run: node scripts/deploy/dokploy.mjs preview-down
