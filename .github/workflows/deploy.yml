# Production deploy on the-keep (D-036): images tagged main + sha, Dokploy redeploy, Trigger.dev tasks.
# Skipped until vars.DOKPLOY_URL is set, see docs/infra.md#production.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: vars.DOKPLOY_URL != ''
    runs-on: the-keep
    timeout-minutes: 30
    env:
      DASHBOARD_URL: https://${{ vars.PRODUCTION_DASHBOARD_HOST }}
      API_URL: https://${{ vars.PRODUCTION_API_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/findmalek/lyterion-api:main
            ghcr.io/findmalek/lyterion-api:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_LYTERION_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_LYTERION_DASHBOARD_URL=${{ env.DASHBOARD_URL }}
            NEXT_PUBLIC_LYTERION_ALLOWED_ORIGIN=${{ env.DASHBOARD_URL }}
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}

      - name: Build dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/findmalek/lyterion-dashboard:main
            ghcr.io/findmalek/lyterion-dashboard:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_LYTERION_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_LYTERION_DASHBOARD_URL=${{ env.DASHBOARD_URL }}
            NEXT_PUBLIC_LYTERION_ALLOWED_ORIGIN=${{ env.DASHBOARD_URL }}
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}

      - name: Deploy apps
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_PUBLIC_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          PRODUCTION_APP_ENV: ${{ secrets.PRODUCTION_APP_ENV }}
          PRODUCTION_DASHBOARD_HOST: ${{ vars.PRODUCTION_DASHBOARD_HOST }}
          PRODUCTION_API_HOST: ${{ vars.PRODUCTION_API_HOST }}
        run: node scripts/deploy/dokploy.mjs production

      - name: Setup pnpm
        if: vars.LYTERION_TRIGGER_API_URL != ''
        uses: pnpm/action-setup@v4

      - name: Deploy Trigger.dev tasks
        if: vars.LYTERION_TRIGGER_API_URL != ''
        env:
          LYTERION_TRIGGER_API_URL: ${{ vars.LYTERION_TRIGGER_API_URL }}
          LYTERION_TRIGGER_PROJECT_REF: ${{ vars.LYTERION_TRIGGER_PROJECT_REF }}
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: pnpm install --frozen-lockfile && pnpm deploy:trigger
