# Production deploy on Dokploy (D-036, D-037), built on GitHub runners: images tagged main + sha, Dokploy redeploy, Trigger.dev tasks.
# Skipped until vars.DEPLOY_ENABLED is "true", see docs/infra.md#production.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Both images build in parallel, each with its own GHA cache scope so neither overwrites the other's layers.
  build:
    if: vars.DOKPLOY_PUBLIC_URL != '' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, dashboard]
    env:
      DASHBOARD_URL: https://${{ vars.PRODUCTION_DASHBOARD_HOST }}
      API_URL: https://${{ vars.PRODUCTION_API_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/findmalek/lyterion-${{ matrix.app }}:main
            ghcr.io/findmalek/lyterion-${{ matrix.app }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_LYTERION_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_LYTERION_DASHBOARD_URL=${{ env.DASHBOARD_URL }}
            NEXT_PUBLIC_LYTERION_ALLOWED_ORIGIN=${{ env.DASHBOARD_URL }}
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max,ignore-error=true

  deploy:
    needs: build
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy apps
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
          DOKPLOY_PUBLIC_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
          PRODUCTION_APP_ENV: |
            LYTERION_BETTER_AUTH_SECRET=${{ secrets.LYTERION_BETTER_AUTH_SECRET }}
            LYTERION_SPOTIFY_CLIENT_ID=${{ secrets.LYTERION_SPOTIFY_CLIENT_ID }}
            LYTERION_SPOTIFY_CLIENT_SECRET=${{ secrets.LYTERION_SPOTIFY_CLIENT_SECRET }}
            LYTERION_NAVIDROME_URL=${{ vars.LYTERION_NAVIDROME_URL }}
            LYTERION_NAVIDROME_USER=${{ vars.LYTERION_NAVIDROME_USER }}
            LYTERION_NAVIDROME_PASSWORD=${{ secrets.LYTERION_NAVIDROME_PASSWORD }}
            LYTERION_GROQ_API_KEY=${{ secrets.LYTERION_GROQ_API_KEY }}
            LYTERION_ACOUSTID_API_KEY=${{ secrets.LYTERION_ACOUSTID_API_KEY }}
            LYTERION_NTFY_URL=${{ vars.LYTERION_NTFY_URL }}
            LYTERION_TRIGGER_API_URL=${{ vars.LYTERION_TRIGGER_API_URL }}
            LYTERION_TRIGGER_SECRET_KEY=${{ secrets.LYTERION_TRIGGER_SECRET_KEY }}
          PRODUCTION_DASHBOARD_HOST: ${{ vars.PRODUCTION_DASHBOARD_HOST }}
          PRODUCTION_API_HOST: ${{ vars.PRODUCTION_API_HOST }}
          PRODUCTION_POSTGRES_ID: ${{ vars.PRODUCTION_POSTGRES_ID }}
          TRIGGER_ENV_FILE: ${{ runner.temp }}/trigger-env.json
        run: node scripts/deploy/dokploy.mjs production

      - name: Setup pnpm
        if: vars.LYTERION_TRIGGER_API_URL != ''
        uses: pnpm/action-setup@v4

      # Self-hosted deploys build on this runner and push to the registry the webapp names (ghcr.io, #4).
      - name: Log in to GHCR for the task image
        if: vars.LYTERION_TRIGGER_API_URL != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Deploy Trigger.dev tasks
        if: vars.LYTERION_TRIGGER_API_URL != ''
        env:
          LYTERION_TRIGGER_API_URL: ${{ vars.LYTERION_TRIGGER_API_URL }}
          LYTERION_TRIGGER_PROJECT_REF: ${{ vars.LYTERION_TRIGGER_PROJECT_REF }}
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_ENV_FILE: ${{ runner.temp }}/trigger-env.json
        run: pnpm install --frozen-lockfile && pnpm deploy:trigger
