# Runs on every push/PR: install, lint, typecheck+build, and test — in parallel jobs
# so a failure in one (e.g. lint) doesn't block visibility into the others.
#
# build/test use Turborepo's remote cache (Vercel) when TURBO_TOKEN is set, so
# unchanged packages skip re-building/re-testing entirely. Requires:
#   - repo secret TURBO_TOKEN: a Vercel access token (vercel.com/account/tokens)
#   - repo variable TURBO_TEAM: findmalek-team
# Without them, turbo silently falls back to no remote cache (still correct,
# just slower — every run rebuilds from scratch).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome ci .

      # Scoped to the diff, not the whole repo — see the script's own header.
      - name: No multi-line comments
        run: node scripts/check-comment-blocks.mjs "origin/${{ github.event.pull_request.base.ref || 'main' }}"

  build:
    runs-on: ubuntu-latest
    env:
      # SKIP_ENV_VALIDATION skips the zod check, but some routes still read these during static generation.
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_LYTERION_API_URL: "http://127.0.0.1:3001"
      NEXT_PUBLIC_LYTERION_DASHBOARD_URL: "http://127.0.0.1:3002"
      LYTERION_DATABASE_URL: "postgresql://postgres:password@localhost:5434/lyterion"
      LYTERION_BETTER_AUTH_SECRET: "ci-build-only-placeholder-not-a-real-secret-32"
      LYTERION_SPOTIFY_CLIENT_ID: "ci-build-only-placeholder"
      LYTERION_SPOTIFY_CLIENT_SECRET: "ci-build-only-placeholder"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc --noEmit for every package plus a full Next.js build of api and dashboard.
      - name: Build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "true"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
