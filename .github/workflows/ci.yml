# Runs on every push/PR: lint, typecheck+build and test as parallel jobs on GitHub runners (D-037).
# Turbo remote cache is the self-hosted one on the-keep: vars.TURBO_API, vars.TURBO_TEAM, secrets.TURBO_TOKEN.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: [self-hosted, the-keep]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome ci .

      # Scoped to the diff, not the whole repo — see the script's own header.
      - name: No multi-line comments
        run: node scripts/check-comment-blocks.mjs "origin/${{ github.event.pull_request.base.ref || 'main' }}"

  build:
    runs-on: [self-hosted, the-keep]
    env:
      # SKIP_ENV_VALIDATION skips the zod check, but some routes still read these during static generation.
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_LYTERION_API_URL: "http://127.0.0.1:3001"
      NEXT_PUBLIC_LYTERION_DASHBOARD_URL: "http://127.0.0.1:3002"
      LYTERION_DATABASE_URL: "postgresql://postgres:password@localhost:5434/lyterion"
      LYTERION_BETTER_AUTH_SECRET: "ci-build-only-placeholder-not-a-real-secret-32"
      LYTERION_SPOTIFY_CLIENT_ID: "ci-build-only-placeholder"
      LYTERION_SPOTIFY_CLIENT_SECRET: "ci-build-only-placeholder"
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc --noEmit for every package plus a full Next.js build of api and dashboard.
      - name: Build
        run: pnpm build

  test:
    runs-on: [self-hosted, the-keep]
    env:
      SKIP_ENV_VALIDATION: "true"
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
