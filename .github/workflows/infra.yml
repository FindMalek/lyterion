# Deploys the turbo cache compose to Dokploy from a GitHub hosted runner (D-036, D-037), run manually.

name: Infra

on:
  workflow_dispatch:
    inputs:
      remove_postgres_ids:
        description: "Postgres ids to delete instead of deploying the cache (space separated)"
        required: false
        default: ""

jobs:
  ci-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy lyterion-ci compose
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_PUBLIC_URL || 'https://dokploy.findmalek.engineer' }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          GARAGE_ACCESS_KEY: ${{ secrets.GARAGE_ACCESS_KEY }}
          GARAGE_SECRET_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
        run: node scripts/deploy/dokploy.mjs ci-infra
        if: inputs.remove_postgres_ids == ''

      - name: Remove orphaned Postgres services
        if: inputs.remove_postgres_ids != ''
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          POSTGRES_IDS: ${{ inputs.remove_postgres_ids }}
        run: node scripts/deploy/dokploy.mjs remove-postgres
