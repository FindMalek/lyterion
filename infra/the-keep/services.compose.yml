# Dokploy compose "lyterion-services" on the-keep (#7): slskd straight on the home connection (D-045) and ntfy (D-034).
# services-vpn.compose.yml is the same stack behind gluetun. Env comes from the Dokploy compose env, never committed.

services:
  # Writes slskd.yml from env; slskd reloads the file on change.
  slskd-config:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      SLSK_USERNAME: ${SLSK_USERNAME}
      SLSK_PASSWORD: ${SLSK_PASSWORD}
      SLSKD_WEB_USERNAME: ${SLSKD_WEB_USERNAME:-findmalek}
      SLSKD_WEB_PASSWORD: ${SLSKD_WEB_PASSWORD}
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      # slskd-config.sh, base64, set by the deploy: a raw Dokploy compose has no repo files next to it.
      SLSKD_CONFIG_SCRIPT: ${SLSKD_CONFIG_SCRIPT}
    volumes:
      - slskd-app:/app
      - /srv/lyterion/slskd-downloads:/downloads
    command: ["/bin/sh", "-c", "echo \"$$SLSKD_CONFIG_SCRIPT\" | base64 -d > /tmp/slskd-config.sh && exec /bin/sh /tmp/slskd-config.sh"]
    healthcheck:
      test: ["CMD", "test", "-s", "/app/slskd.yml"]
      interval: 5s
      retries: 30

  # No published ports and no router forward: slskd only dials out, so nothing new is reachable from the internet.
  slskd:
    image: slskd/slskd:0.21.4
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      slskd-config:
        condition: service_healthy
    environment:
      SLSKD_REMOTE_CONFIGURATION: "false"
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - slskd-app:/app
      # Shares the library read only (Soulseek expects sharing); downloads land where the Trigger worker reads them.
      - /srv/music:/music:ro
      - /srv/lyterion/slskd-downloads:/downloads
    networks:
      dokploy-network:
        aliases:
          - slskd

  # PO tokens for yt-dlp (bgutil), so YouTube downloads pass its bot checks without cookies. Same version as the plugin in apps/api/trigger.config.ts.
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.1
    restart: unless-stopped
    init: true
    networks:
      dokploy-network:
        aliases:
          - bgutil-pot

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://ntfy.findmalek.engineer}
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_BEHIND_PROXY: "true"
      NTFY_ENABLE_LOGIN: "true"
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ntfy:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q true"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      dokploy-network:
        aliases:
          - ntfy

volumes:
  slskd-app:
  ntfy:

networks:
  dokploy-network:
    external: true
