# Dokploy compose "lyterion-ci" on the-keep (D-036, D-037): only the turbo remote cache, CI runs on GitHub.
# Deployed by .github/workflows/infra.yml, env comes from repo secrets and is never committed.

services:
  turbo-cache:
    image: ducktors/turborepo-remote-cache:2.6.1
    restart: unless-stopped
    environment:
      TURBO_TOKEN: ${TURBO_TOKEN}
      STORAGE_PROVIDER: s3
      STORAGE_PATH: turbo-cache
      S3_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      S3_SECRET_KEY: ${GARAGE_SECRET_KEY}
      S3_ENDPOINT: http://infrastructure-garage-lqdycf-garage-1:3900
      S3_REGION: garage
      LOG_LEVEL: info
    networks:
      dokploy-network:
        aliases:
          - turbo-cache

networks:
  dokploy-network:
    external: true
